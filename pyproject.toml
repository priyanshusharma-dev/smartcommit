[project]
name = "smartcommit"
version = "0.2.0"
description = "AI-powered, privacy-first Conventional Commit message generator that runs locally via Ollama"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Priyanshu Sharma" }
]
keywords = ["git", "cli", "llm", "ollama", "conventional-commits", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/priyanshusharma-dev/smartcommit"
Repository = "https://github.com/priyanshusharma-dev/smartcommit"
Issues = "https://github.com/priyanshusharma-dev/smartcommit/issues"

[project.scripts]
smartcommit = "smartcommit.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smartcommit*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]