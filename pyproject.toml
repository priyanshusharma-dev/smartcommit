[project]
name = "smartcommit"
version = "0.1.0"
description = "AI-powered Git commit message generator"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
smartcommit = "smartcommit.cli:app"

[tool.setuptools.packages.find]
include = ["smartcommit*"]
exclude = ["tests*", "examples*"]